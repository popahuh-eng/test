services:
  - type: web
    name: trading-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trading-redis
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: trading-ml
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: demo
      - key: NEWS_PROVIDER
        value: demo

  - type: web
    name: trading-frontend
    runtime: docker
    dockerfilePath: docker/frontend.Dockerfile
    plan: starter

  - type: web
    name: trading-ml
    runtime: docker
    dockerfilePath: docker/ml.Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trading-redis
          property: connectionString

databases:
  - name: trading-postgres
    databaseName: trading_platform
    user: trading
    plan: starter

# Redis
# Render supports managed Redis through the dashboard
